        /** Main Game Controller **/
        function startGame(mode) {
            SoundEngine.enable();
            gameState.mode = mode;
            gameState.score = 0;
            gameState.level = 1;
            gameState.isActive = true;
            gameState.frameCount = 0;

            player = new Player(false);
            if (mode === 'coop') player2 = new Player(true);
            else player2 = null;

            entities = { enemies: [], bullets: [], particles: [], powerups: [], platforms: [] };
            ui.startScreen.style.display = 'none';
            ui.mode.innerText = mode.toUpperCase();
            ui.bossContainer.style.display = 'none';

            selectWeapon(1);
            loadLevel();
            updateCursorState();

            lastTime = 0;
            accumulator = 0;
            requestAnimationFrame(gameLoop);
        }

        function selectWeapon(wepNum) {
            if (player) {
                player.weapon = wepNum;
                let names = ["", "BLASTER", "UZI", "SHOTGUN", "TRIPLE", "SNIPER", "PLASMA"];
                ui.weapon.innerText = names[wepNum] || "BLASTER";

                let btns = document.querySelectorAll('.wep-btn');
                for (let i = 0; i < btns.length; i++) btns[i].classList.remove('active');
                let b = document.getElementById(`wep${wepNum}-btn`);
                if (b) b.classList.add('active');
            }
        }

        function endGame() {
            gameState.isActive = false;
            SoundEngine.stop('laser_charge');
            let isNew = HighScores.save(gameState.score);
            updateHighScoreDisplay();
            updateCursorState();

            if (document.exitPointerLock) {
                try { document.exitPointerLock(); } catch (e) { }
            }

            ui.bossContainer.style.display = 'none';
            ui.startScreen.style.display = 'flex';
            ui.startScreen.innerHTML = `
                <h1>Curled.</h1>
                <p style="font-size:24px; color:yellow; margin:10px 0;">score: ${gameState.score} ${isNew ? '(NEW HIGH SCORE!)' : ''}</p>
                <p style="font-size:20px; margin-bottom:25px;">LEVEL: ${gameState.level}</p>
                <div class="menu-buttons">
                    <button onclick="location.reload()">MAIN MENU</button>
                </div>
            `;
        }

        function loadLevel() {
            entities.bullets.length = 0;
            entities.particles.length = 0;
            entities.platforms.length = 0;
            entities.powerups.length = 0;
            if (gameState.mode === 'levels' || (gameState.mode === 'coop' && Multiplayer.isHost)) entities.enemies.length = 0;

            let lvl = gameState.level;
            const themes = ['grass', 'moon', 'underground', 'mars'];
            gameState.theme = themes[(lvl - 1) % themes.length];

            if (gameState.mode !== 'coop' || Multiplayer.isHost) {
                generatePlatforms();
                spawnLevelEnemies();
            }
        }

        function generatePlatforms() {
            entities.platforms.push({ x: 0, y: GAME_HEIGHT - 40, w: GAME_WIDTH, h: 40, type: 'ground' });

            let num = 4 + Math.floor(Math.random() * 4);
            for (let i = 0; i < num; i++) {
                entities.platforms.push({
                    x: 100 + Math.random() * (GAME_WIDTH - 300),
                    y: GAME_HEIGHT - 180 - Math.random() * (GAME_HEIGHT / 1.8),
                    w: 120 + Math.random() * 120,
                    h: 24,
                    type: 'block'
                });
            }
        }

        function spawnLevelEnemies() {
            let lvl = gameState.level;
            if (lvl % 5 === 0) {
                entities.enemies.push(new TitanFimm(GAME_WIDTH / 2 - 90, 100));
                showFloatingText("BOSS WARNING!", GAME_WIDTH / 2 - 80, 200, '#e74c3c', 36);
                return;
            }

            let count = 3 + Math.floor(lvl * 1.3);
            for (let i = 0; i < count; i++) {
                spawnRandomEnemy(lvl);
            }
        }

        function spawnRandomEnemy(difficultyLevel) {
            let rand = Math.random();
            let x = 100 + Math.random() * (GAME_WIDTH - 200);
            let y = 100 + Math.random() * (GAME_HEIGHT / 2.2);

            if (rand < 0.25) entities.enemies.push(new Sludge(x, GAME_HEIGHT - 80));
            else if (rand < 0.45) entities.enemies.push(new Batty(GAME_WIDTH, y));
            else if (rand < 0.65) entities.enemies.push(new Chip(x, y));
            else if (rand < 0.80) entities.enemies.push(new ZapDrone(x, y));
            else if (rand < 0.92) entities.enemies.push(new Roller(x, GAME_HEIGHT - 80));
            else entities.enemies.push(new Fimm(x, y));

            if (difficultyLevel >= 3 && Math.random() < 0.08 && !entities.enemies.some(e => e instanceof WhaleThing)) {
                entities.enemies.push(new WhaleThing(GAME_WIDTH - 80, GAME_HEIGHT - 120));
            }
        }

        // Multiplayer Hooks
        function onGameStateReceived(data) {
            if (data.type === 'state') {
                let s = data.data;
                if (player2) {
                    player2.x = s.p.x; player2.y = s.p.y; player2.hp = s.p.hp; player2.vx = s.p.vx; player2.grounded = s.p.grounded;
                }
                if (s.p2 && player) {
                    player.hp = s.p2.hp;
                    if (player.hp <= 0) endGame();
                }
                gameState.level = s.lvl;
                ui.level.innerText = s.lvl;
                gameState.score = s.score;
            }
        }

        function onClientInputReceived(data) {
            if (data.type === 'input' && player2) {
                let s = data.data;
                player2.x = s.x; player2.y = s.y; player2.hp = s.hp;
                if (s.isShooting) player2.shoot(s.aimAngle);
            }
        }

        /** Fixed 60Hz Timestep Game Loop **/
        let lastTime = 0;
        let accumulator = 0;
        const FIXED_STEP = 1000 / 60;

        function updatePhysics() {
            gameState.frameCount++;

            player.update();

            let pWrite = 0;
            for (let i = 0; i < entities.powerups.length; i++) {
                let p = entities.powerups[i];
                p.update();
                if (p.life > 0) entities.powerups[pWrite++] = p;
            }
            entities.powerups.length = pWrite;

            let bWrite = 0;
            for (let i = 0; i < entities.bullets.length; i++) {
                let b = entities.bullets[i];
                if (!(gameState.mode === 'coop' && Multiplayer.isClient)) b.update();
                if (b.life > 0) entities.bullets[bWrite++] = b;
            }
            entities.bullets.length = bWrite;

            let partWrite = 0;
            for (let i = 0; i < entities.particles.length; i++) {
                let part = entities.particles[i];
                part.update();
                if (part.life > 0) entities.particles[partWrite++] = part;
            }
            entities.particles.length = partWrite;

            let eWrite = 0;
            for (let i = 0; i < entities.enemies.length; i++) {
                let e = entities.enemies[i];
                if (!(gameState.mode === 'coop' && Multiplayer.isClient)) e.update();
                if (!e.dead) entities.enemies[eWrite++] = e;
            }
            entities.enemies.length = eWrite;

            if (gameState.mode === 'levels' || (gameState.mode === 'coop' && Multiplayer.isHost)) {
                if (entities.enemies.length === 0 && gameState.frameCount > 60) {
                    gameState.level++;
                    ui.level.innerText = gameState.level;
                    player.hp = Math.min(player.hp + 25, player.maxHp);
                    if (player2) player2.hp = Math.min(player2.hp + 25, player2.maxHp);
                    showFloatingText(`WAVE ${gameState.level}!`, GAME_WIDTH / 2 - 60, 200, '#2ecc71', 30);
                    loadLevel();
                }
            } else if (gameState.mode === 'endless') {
                let spawnRate = Math.max(35, 170 - gameState.level * 10);
                let maxEnemies = Math.min(22, 5 + gameState.level * 2);

                if (gameState.frameCount % spawnRate === 0 && entities.enemies.length < maxEnemies) {
                    spawnRandomEnemy(gameState.level);
                }

                if (gameState.score > gameState.level * 1200) {
                    gameState.level++;
                    ui.level.innerText = gameState.level;
                    player.hp = Math.min(player.hp + 15, player.maxHp);
                    if (gameState.level % 4 === 0) loadLevel();
                }
            }

            if (gameState.mode === 'coop' && Multiplayer.isConnected) {
                if (Multiplayer.isHost) {
                    Multiplayer.sendData({
                        type: 'state',
                        data: {
                            p: { x: Math.round(player.x), y: Math.round(player.y), hp: player.hp, vx: player.vx, grounded: player.grounded },
                            p2: player2 ? { hp: player2.hp } : null,
                            lvl: gameState.level,
                            score: gameState.score
                        }
                    });
                } else if (Multiplayer.isClient) {
                    let isShooting = (keys[' '] || mouse.down || touchInput.shoot) && player.shootCooldown <= 0;
                    Multiplayer.sendData({
                        type: 'input',
                        data: {
                            x: Math.round(player.x), y: Math.round(player.y), hp: player.hp,
                            aimAngle: Math.atan2(mouse.y - player.y, mouse.x - player.x),
                            isShooting: isShooting
                        }
                    });
                }
            }
        }

        function render() {
            let sx = 0, sy = 0;
            if (shakeIntensity > 0) {
                sx = (Math.random() - 0.5) * shakeIntensity;
                sy = (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity *= 0.85;
                if (shakeIntensity < 0.5) shakeIntensity = 0;
            }

            if (sx !== 0 || sy !== 0) {
                ctx.save();
                ctx.translate(sx, sy);
            }

            ctx.fillStyle = cachedBgGradients[gameState.theme] || '#050508';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            for (let i = 0; i < entities.platforms.length; i++) drawPlatform(entities.platforms[i]);

            player.draw();
            if (player2) player2.draw();

            for (let i = 0; i < entities.powerups.length; i++) entities.powerups[i].draw();
            for (let i = 0; i < entities.bullets.length; i++) entities.bullets[i].draw();
            for (let i = 0; i < entities.particles.length; i++) entities.particles[i].draw();
            for (let i = 0; i < entities.enemies.length; i++) entities.enemies[i].draw();

            // Reticle
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "rgba(52, 152, 219, 0.9)"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y + 12);
            ctx.stroke();

            ui.score.innerText = gameState.score;

            if (sx !== 0 || sy !== 0) ctx.restore();
        }

        function gameLoop(timestamp) {
            if (!gameState.isActive) return;

            if (!lastTime) lastTime = timestamp;
            let delta = timestamp - lastTime;
            lastTime = timestamp;

            if (delta > 250) delta = FIXED_STEP;

            accumulator += delta;
            while (accumulator >= FIXED_STEP) {
                updatePhysics();
                accumulator -= FIXED_STEP;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        function drawPlatform(p) {
            if (p.type === 'ground') {
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#44aa00';
                ctx.fillRect(p.x, p.y, p.w, 8);
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
            } else {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(p.x + 4, p.y + 4, p.w, p.h);
                ctx.fillStyle = '#34495e';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = "rgba(255,255,255,0.15)";
                ctx.fillRect(p.x, p.y, p.w, 4);
                ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h);
            }
        }

        /** Controls & Keyboard Listeners **/
        window.addEventListener('keydown', e => {
            let k = e.key.toLowerCase();
            keys[k] = true;
            keys[e.key] = true;
            keys[e.code] = true;

            if (k === '1' || e.code === 'Digit1' || e.code === 'Numpad1') selectWeapon(1);
            if (k === '2' || e.code === 'Digit2' || e.code === 'Numpad2') selectWeapon(2);
            if (k === '3' || e.code === 'Digit3' || e.code === 'Numpad3') selectWeapon(3);
            if (k === '4' || e.code === 'Digit4' || e.code === 'Numpad4') selectWeapon(4);
            if (k === '5' || e.code === 'Digit5' || e.code === 'Numpad5') selectWeapon(5);
            if (k === '6' || e.code === 'Digit6' || e.code === 'Numpad6') selectWeapon(6);
        });

        window.addEventListener('keyup', e => {
            let k = e.key.toLowerCase();
            keys[k] = false;
            keys[e.key] = false;
            keys[e.code] = false;
            if (e.key.length === 1) {
                keys[e.key.toLowerCase()] = false;
                keys[e.key.toUpperCase()] = false;
            }
        });

        window.addEventListener('blur', () => {
            keys = {};
        });

        function updateMousePos(e) {
            if (document.pointerLockElement === canvas) {
                mouse.x = Math.max(0, Math.min(GAME_WIDTH, mouse.x + e.movementX * cachedCanvasRect.scaleX));
                mouse.y = Math.max(0, Math.min(GAME_HEIGHT, mouse.y + e.movementY * cachedCanvasRect.scaleY));
            } else {
                let rawX = (e.clientX - cachedCanvasRect.left) * cachedCanvasRect.scaleX;
                let rawY = (e.clientY - cachedCanvasRect.top) * cachedCanvasRect.scaleY;
                mouse.x = Math.max(0, Math.min(GAME_WIDTH, rawX));
                mouse.y = Math.max(0, Math.min(GAME_HEIGHT, rawY));
            }
        }

        canvas.addEventListener('mousemove', updateMousePos);
        canvas.addEventListener('mousedown', e => { updateMousePos(e); mouse.down = true; });
        canvas.addEventListener('mouseup', e => { mouse.down = false; });

        function bindTouchBtn(id, onStart, onEnd) {
            let btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('touchstart', e => { e.preventDefault(); onStart(); });
            btn.addEventListener('touchend', e => { e.preventDefault(); onEnd(); });
            btn.addEventListener('touchcancel', e => { e.preventDefault(); onEnd(); });
        }

        bindTouchBtn('dpad-left', () => touchInput.left = true, () => touchInput.left = false);
        bindTouchBtn('dpad-right', () => touchInput.right = true, () => touchInput.right = false);
        bindTouchBtn('btn-jump', () => touchInput.jump = true, () => touchInput.jump = false);
        bindTouchBtn('btn-shoot', () => touchInput.shoot = true, () => touchInput.shoot = false);
        bindTouchBtn('btn-dash', () => { if (player) player.dash(); }, () => { });
        bindTouchBtn('btn-wep-swap', () => {
            if (player) {
                let next = (player.weapon % 6) + 1;
                selectWeapon(next);
            }
        }, () => { });

        // Giant Air Jump Zone Listener
        const airJumpZone = document.getElementById('touch-air-jump-zone');
        if (airJumpZone) {
            airJumpZone.addEventListener('touchstart', e => {
                e.preventDefault();
                touchInput.jump = true;
                if (e.touches.length > 0) {
                    updateMousePos(e.touches[0]);
                    mouse.down = true;
                }
            });
            airJumpZone.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches.length > 0) updateMousePos(e.touches[0]);
            });
            airJumpZone.addEventListener('touchend', e => {
                e.preventDefault();
                touchInput.jump = false;
                mouse.down = false;
            });
            airJumpZone.addEventListener('touchcancel', e => {
                e.preventDefault();
                touchInput.jump = false;
                mouse.down = false;
            });
        }

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length > 0) {
                updateMousePos(e.touches[0]);
                mouse.down = true;
            }
        });
        canvas.addEventListener('touchmove', e => {
            if (e.touches.length > 0) updateMousePos(e.touches[0]);
        });
        canvas.addEventListener('touchend', () => mouse.down = false);

        resizeCanvas();
    </script>
</body>

</html>
